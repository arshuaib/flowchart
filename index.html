<style id="flowtrack-navigation-fix">
/* FlowTrack desktop navigation fix: keep navigation visible without covering content. */
@media (min-width: 768px) {
  .flowtrack-bottom-nav {
    display: flex !important;
    position: fixed !important;
    top: 72px !important;
    bottom: 0 !important;
    left: 0 !important;
    right: auto !important;
    width: 220px !important;
    height: calc(100vh - 72px) !important;
    flex-direction: column !important;
    align-items: stretch !important;
    justify-content: flex-start !important;
    border-top: 0 !important;
    border-right: 1px solid #e2e8f0 !important;
    border-top-left-radius: 0 !important;
    border-top-right-radius: 0 !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    z-index: 40 !important;
  }
  .dark .flowtrack-bottom-nav { border-right-color: #1e293b !important; }
  .flowtrack-bottom-nav > div {
    width: 100% !important;
    max-width: none !important;
    height: auto !important;
    min-height: 100% !important;
    padding: 18px 12px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    justify-content: flex-start !important;
    gap: 8px !important;
  }
  .flowtrack-bottom-nav > div > button {
    width: 100% !important;
    min-height: 48px !important;
    height: 48px !important;
    flex: 0 0 48px !important;
    flex-direction: row !important;
    justify-content: flex-start !important;
    align-items: center !important;
    gap: 12px !important;
    padding: 0 14px !important;
    text-align: left !important;
  }
  .flowtrack-bottom-nav > div > button span {
    font-size: 12px !important;
    font-weight: 700 !important;
    letter-spacing: .01em !important;
  }
  .flowtrack-main-content {
    margin-left: 220px !important;
    width: calc(100% - 220px) !important;
    max-width: none !important;
    padding-left: 28px !important;
    padding-right: 28px !important;
    padding-bottom: 40px !important;
  }
}
@media (max-width: 767px) {
  .flowtrack-bottom-nav { display: block !important; }
}
