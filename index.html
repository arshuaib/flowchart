<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta name="description" content="A calm, private plan to rebuild your financial breathing room." />
    <title>Salary Reset</title>
    <script>
      // Browsers block local ES module imports from file:// URLs. Show a useful
      // message instead of leaving an empty root when someone double-clicks HTML.
      if (location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          const root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<main style="max-width:640px;margin:12vh auto;padding:32px;font:16px/1.6 system-ui;color:#26342c"><p style="color:#587963;font-weight:700;letter-spacing:.12em">SALARY RESET</p><h1>Start the local app</h1><p>Your browser cannot load the app modules from a directly opened file. Double-click <strong>Open Salary Reset.cmd</strong> in this folder, or run the local preview command from the README.</p><p>Then open <a href="http://localhost:5173/">http://localhost:5173</a>.</p><p>Your financial data stays in this browser. Google sign-in needs the authorized localhost origin.</p></main>';
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
